services:
  - type: web
    name: openfind
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ENABLE_API_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: WARNING
