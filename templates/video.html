<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f9"><title>OpenFind Video</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17191e;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.shell{width:min(650px,calc(100% - 30px));margin:auto}header{height:66px;border-bottom:1px solid #e5e7eb;background:#fff}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.04em;text-decoration:none;color:#17191e;display:flex;align-items:center;gap:9px}.mark{display:grid;place-items:center;width:31px;height:31px;background:#17191e;color:#fff;border-radius:9px;font-size:14px}.back{color:#525866;text-decoration:none;font-size:12px}main{padding:74px 0 45px}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(32px,7vw,46px);letter-spacing:-.055em;line-height:1.08;margin:0 0 10px}.hero p{margin:0;color:#777f8c;font-size:14px}.inputbox{display:flex;gap:8px;background:#fff;border:1px solid #d8dce3;border-radius:13px;padding:6px;box-shadow:0 5px 20px #10182808}.inputbox:focus-within{border-color:#828b9b;box-shadow:0 0 0 3px #17191e0b}input{min-width:0;flex:1;padding:12px 10px;border:0;outline:0;background:transparent;color:#17191e;font:inherit;font-size:14px}input::placeholder{color:#9aa1ad}.status{display:none;align-items:center;gap:10px;margin:18px 2px;color:#69717e;font-size:12px}.spinner{width:14px;height:14px;border:2px solid #d9dde4;border-top-color:#17191e;border-radius:50%;animation:spin .7s linear infinite}.busy .spinner{display:block}@keyframes spin{to{transform:rotate(360deg)}}.card{display:none;margin-top:18px;border:1px solid #e1e4e9;background:#fff;border-radius:15px;overflow:hidden}.preview{width:100%;max-height:380px;aspect-ratio:16/9;object-fit:contain;background:#111;display:block}.body{padding:18px}.title{font-size:17px;font-weight:750;line-height:1.4;overflow-wrap:anywhere;margin:0 0 5px}.source{font-size:11px;color:#8b929e;overflow-wrap:anywhere}.facts{display:flex;gap:24px;margin:18px 0}.fact span{display:block;font-size:10px;color:#8b929e;margin-bottom:3px}.fact b{font-size:13px;font-weight:700}.download{display:block;text-align:center;text-decoration:none;background:#17191e;color:#fff;padding:12px;border-radius:9px;font-size:13px;font-weight:750}.error{font-size:13px;color:#a04426;line-height:1.7;padding:18px}.foot{text-align:center;font-size:10px;color:#9aa1ad;margin-top:28px;line-height:1.8}.foot a{color:#6d7480}@media(max-width:480px){main{padding-top:52px}.hero p{max-width:320px;margin:auto}.facts{gap:18px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style></head>
<body><header><div class="shell nav"><a class="brand" href="/"><span class="mark">▶</span>OpenFind</a><a class="back" href="/">Back to search</a></div></header>
<main class="shell"><section class="hero"><h1>Video downloader</h1><p>Paste one video link. Get the original video when available.</p></section>
<form id="form"><div class="inputbox"><input id="url" type="url" autocomplete="url" spellcheck="false" placeholder="Paste video link…" aria-label="Video link" required></div></form>
<div id="status" class="status"><span class="spinner"></span><span id="statusText">Checking video…</span></div>
<section id="card" class="card" aria-live="polite"><div id="content"></div></section>
<div class="foot">Works with supported public links. Private, protected, or unsupported videos may not be available.<br><a href="https://github.com/DilipDC/openfind">Open source</a></div></main>
<script>
const form=document.getElementById("form"),input=document.getElementById("url"),status=document.getElementById("status"),statusText=document.getElementById("statusText"),card=document.getElementById("card"),content=document.getElementById("content");let timer=null,controller=null,last="";
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function fail(msg){status.style.display="none";content.replaceChildren(el("div","error",msg));card.style.display="block"}
async function resolve(){const raw=input.value.trim();if(!raw||raw===last)return;let page;try{page=new URL(raw);if(!["http:","https:"].includes(page.protocol))return}catch(_){return}last=raw;if(controller)controller.abort();controller=new AbortController();status.style.display="flex";statusText.textContent="Checking the original video…";card.style.display="none";content.replaceChildren();
try{const r=await fetch("/api/video-resolve?url="+encodeURIComponent(page.href),{signal:controller.signal,headers:{Accept:"application/json"}});let d;try{d=await r.json()}catch(_){throw Error("Could not read the video response.")}if(!r.ok)throw Error(d.detail||"No verified video found.");status.style.display="none";content.replaceChildren();
const video=el("video","preview");video.controls=true;video.preload="metadata";video.playsInline=true;video.src=d.media_url;video.addEventListener("error",()=>{video.replaceWith(el("div","error","Preview unavailable. The source may block direct playback."))},{once:true});content.append(video);
const body=el("div","body");body.append(el("h2","title",d.title||"Video"),el("div","source",new URL(d.webpage_url).hostname));const facts=el("div","facts");[["FORMAT",(d.ext||"video").toUpperCase()],["SIZE",d.size||"Unknown"],["LENGTH",d.duration==null?"—":Math.floor(d.duration/60)+":"+String(Math.floor(d.duration%60)).padStart(2,"0")]].forEach(([a,b])=>{const x=el("div","fact");x.append(el("span","",a),el("b","",String(b)));facts.append(x)});body.append(facts);const a=el("a","download","Download video");a.href=d.media_url;a.target="_blank";a.rel="noopener noreferrer";a.download=(d.title||"video")+"."+(d.ext||"mp4");body.append(a);content.append(body);card.style.display="block";
}catch(e){if(e.name==="AbortError")return;fail(e.message||"Could not find a verified video.");}}
form.addEventListener("submit",e=>{e.preventDefault();last="";resolve()});input.addEventListener("paste",()=>{clearTimeout(timer);last="";timer=setTimeout(resolve,250)});input.addEventListener("change",()=>{last="";resolve()});
</script></body></html>
