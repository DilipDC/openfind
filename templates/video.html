<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>OpenFind Video</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#181a20;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(600px,calc(100% - 28px));margin:auto}header{height:62px;border-bottom:1px solid #e8e9ed;background:#fff}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center;text-decoration:none;color:#181a20;font-weight:800;letter-spacing:-.04em}.logo{width:30px;height:30px;border-radius:9px;background:#181a20;color:#fff;display:grid;place-items:center;font-size:13px}.back{font-size:12px;color:#777d88;text-decoration:none}main{padding:72px 0 40px}.heading{font-size:clamp(30px,7vw,42px);letter-spacing:-.055em;line-height:1.1;text-align:center;margin:0 0 25px;font-weight:800}.search{display:flex;align-items:center;gap:5px;padding:5px;background:#fff;border:1px solid #dfe2e7;border-radius:13px;box-shadow:0 6px 24px #1a243008}.search:focus-within{border-color:#8d95a2;box-shadow:0 0 0 3px #20242d0a}input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:12px 10px;font:inherit;font-size:14px;color:#181a20}input::placeholder{color:#a1a6b0}.go{width:43px;height:43px;flex:0 0 43px;border:0;border-radius:9px;background:#181a20;color:#fff;display:grid;place-items:center;cursor:pointer}.go:hover{background:#353942}.go:disabled{opacity:.55;cursor:wait}.status{display:none;align-items:center;justify-content:center;gap:8px;color:#747b87;font-size:12px;margin:18px 0}.spin{width:13px;height:13px;border:2px solid #dfe2e7;border-top-color:#181a20;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result{display:none;margin-top:18px;border:1px solid #e5e7eb;background:#fff;border-radius:14px;overflow:hidden}.preview{display:block;width:100%;max-height:330px;aspect-ratio:16/9;object-fit:contain;background:#111}.info{padding:17px}.title{font-size:16px;font-weight:750;line-height:1.4;margin:0 0 5px;overflow-wrap:anywhere}.domain{color:#9298a3;font-size:11px;overflow-wrap:anywhere}.meta{display:flex;gap:25px;margin:17px 0}.meta span{display:block;color:#9298a3;font-size:10px;margin-bottom:3px}.meta b{font-size:12px}.download{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:#181a20;color:#fff;text-decoration:none;border-radius:9px;font-size:13px;font-weight:750}.download:hover{background:#353942}.error{display:none;margin-top:16px;padding:14px 16px;background:#fff8f2;border:1px solid #f0dfd0;color:#8b4829;border-radius:10px;font-size:12px;line-height:1.6}.foot{text-align:center;color:#a0a5ae;font-size:10px;margin-top:25px}@media(max-width:480px){main{padding-top:55px}.wrap{width:calc(100% - 24px)}.heading{margin-bottom:20px}.meta{gap:20px}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="/"><span class="logo">▶</span>OpenFind</a><a class="back" href="/">Search</a></div></header>
<main class="wrap"><h1 class="heading">Video downloader</h1><form id="form" class="search"><input id="url" type="url" placeholder="Paste video link" aria-label="Video URL" autocomplete="url" spellcheck="false" required><button class="go" id="go" type="submit" aria-label="Find video" title="Find video"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></form>
<div class="status" id="status"><span class="spin"></span><span id="statusText">Finding video…</span></div><div class="error" id="error" role="alert"></div>
<section class="result" id="result" aria-live="polite"><video class="preview" id="preview" controls playsinline preload="none" hidden></video><div class="info"><h2 class="title" id="title"></h2><div class="domain" id="domain"></div><div class="meta"><div><span>FORMAT</span><b id="format">—</b></div><div><span>SIZE</span><b id="size">—</b></div><div><span>LENGTH</span><b id="duration">—</b></div></div><a class="download" id="download" href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 17v3h16v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Download video</a></div></section>
<div class="foot">Only accessible videos can be downloaded.</div></main>
<script>
const form=document.querySelector("#form"),input=document.querySelector("#url"),go=document.querySelector("#go"),status=document.querySelector("#status"),statusText=document.querySelector("#statusText"),error=document.querySelector("#error"),result=document.querySelector("#result"),preview=document.querySelector("#preview");let ctrl=null,last="";
form.addEventListener("submit",async e=>{e.preventDefault();const raw=input.value.trim();if(!raw)return;let page;try{page=new URL(raw);if(!["http:","https:"].includes(page.protocol))throw 0}catch(_){error.style.display="block";error.textContent="Enter a valid video link.";return}if(raw===last)return;last=raw;if(ctrl)ctrl.abort();ctrl=new AbortController();go.disabled=true;status.style.display="flex";error.style.display="none";result.style.display="none";statusText.textContent="Finding video…";try{const r=await fetch("/api/video-resolve?url="+encodeURIComponent(page.href),{signal:ctrl.signal});const d=await r.json();if(!r.ok)throw Error(d.detail||"Video not available.");document.querySelector("#title").textContent=d.title||"Video";document.querySelector("#domain").textContent=new URL(d.webpage_url).hostname;document.querySelector("#format").textContent=(d.ext||"—").toUpperCase();document.querySelector("#size").textContent=d.size||"Unknown";document.querySelector("#duration").textContent=d.duration==null?"—":Math.floor(d.duration/60)+":"+String(Math.floor(d.duration%60)).padStart(2,"0");if(typeof d.download_url!=="string"||!d.download_url.startsWith("/api/video-download?"))throw Error("The extractor returned no valid download link. Try another public video URL.");document.querySelector("#download").href=d.download_url;preview.pause();preview.removeAttribute("src");preview.load();preview.hidden=true;result.style.display="block";status.style.display="none"}catch(err){if(err.name==="AbortError")return;last="";status.style.display="none";error.textContent=err.message||"Could not get this video.";error.style.display="block"}finally{go.disabled=false}});
input.addEventListener("paste",()=>{last="";setTimeout(()=>{if(input.value.trim())form.requestSubmit()},150)});
</script></body></html>
